<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="What Mehmet Cinar is learning, from which courses, and how far he has got." />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap" />
		<title>Learning – Mehmet Cinar</title>
		<script>
			// Shared light/dark choice (cookie on .mehmetcinar.com), else the system setting.
			(function () {
				var cookie = document.cookie.match(/(?:^|; )theme=(light|dark|system)/);
				var choice = cookie ? cookie[1] : "system";
				var dark = choice === "dark" || (choice === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
				document.documentElement.dataset.theme = dark ? "dark" : "light";
			})();
		</script>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/react-app/main.tsx"></script>
	</body>
</html>
